<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROGORI 2026 // Next-Gen Sandbox</title>
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-panel: rgba(20, 23, 34, 0.85);
            --bg-card: #151824;
            --accent: #00f5d4;
            --accent-secondary: #7b2cbf;
            --accent-hover: #00c4a9;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border: rgba(0, 245, 212, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(123, 44, 191, 0.15), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 245, 212, 0.12), transparent 40%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar 2026 Glassmorphism */
        header {
            background-color: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #090a0f;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }

        .year-badge {
            font-size: 0.7rem;
            background: rgba(0, 245, 212, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 99px;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 20px 6px;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        nav button:hover, nav button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.4);
        }

        .user-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .currency {
            background-color: rgba(0, 245, 212, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: var(--accent);
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .avatar-mini {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background-color: #00f5d4;
            border: 2px solid var(--text-main);
        }

        /* Main Layout */
        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            flex: 1;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .search-bar input {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
        }

        /* Game Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 22px;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 245, 212, 0.15);
            border-color: var(--accent);
        }

        .game-thumb {
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            position: relative;
        }

        .genre-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(9, 10, 15, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
        }

        .game-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .game-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 10px;
        }

        /* Avatar Editor */
        .avatar-studio {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            background-color: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .character-preview {
            background-color: var(--bg-dark);
            border-radius: 12px;
            height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .char-head {
            width: 64px;
            height: 64px;
            background-color: #00f5d4;
            border-radius: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #090a0f;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.3);
        }

        .char-body-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .char-arm {
            width: 32px;
            height: 90px;
            background-color: #00f5d4;
            border-radius: 8px;
        }

        .char-torso {
            width: 84px;
            height: 90px;
            background-color: #7b2cbf;
            border-radius: 8px;
        }

        .char-legs-row {
            display: flex;
            gap: 6px;
        }

        .char-leg {
            width: 39px;
            height: 95px;
            background-color: #1d1e2c;
            border-radius: 8px;
        }

        .color-group {
            margin-bottom: 22px;
        }

        .color-group h3 {
            margin-bottom: 12px;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .swatches {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
        }

        .swatch:hover {
            transform: scale(1.12);
            border-color: #fff;
        }

        /* Create Studio */
        .create-box {
            background-color: var(--bg-card);
            padding: 28px;
            border-radius: 16px;
            border: 1px solid var(--border);

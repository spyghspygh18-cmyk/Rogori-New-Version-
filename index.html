<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROGORI 2026 // Next-Gen Sandbox</title>
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-panel: rgba(20, 23, 34, 0.9);
            --bg-card: #151824;
            --accent: #00f5d4;
            --accent-secondary: #7b2cbf;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border: rgba(0, 245, 212, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(123, 44, 191, 0.18), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 245, 212, 0.15), transparent 40%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #090a0f;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }

        .year-badge {
            font-size: 0.7rem;
            background: rgba(0, 245, 212, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 99px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            padding: 20px 6px;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        nav button:hover, nav button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .user-stats {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .currency {
            background-color: rgba(0, 245, 212, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            color: var(--accent);
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: #00f5d4;
            border: 2px solid var(--text-main);
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
            flex: 1;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.9rem;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .search-bar {
            display: flex;
            margin-bottom: 28px;
        }

        .search-bar input {
            flex: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 22px;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .game-thumb {
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            position: relative;
        }

        .genre-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(9, 10, 15, 0.85);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
        }

        .game-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .game-author {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 10px;
        }

        .avatar-studio {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            background-color: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .character-preview {
            background-color: var(--bg-dark);
            border-radius: 12px;
            height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .char-head {
            width: 64px;
            height: 64px;
            background-color: #00f5d4;
            border-radius: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #090a0f;
            font-size: 1.1rem;
        }

        .char-body-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .char-arm {
            width: 32px;
            height: 90px;
            background-color: #00f5d4;
            border-radius: 8px;
        }

        .char-torso {
            width: 84px;
            height: 90px;
            background-color: #7b2cbf;
            border-radius: 8px;
        }

        .char-legs-row {
            display: flex;
            gap: 6px;
        }

        .char-leg {
            width: 39px;
            height: 95px;
            background-color: #1d1e2c;
            border-radius: 8px;
        }

        .color-group {
            margin-bottom: 20px;
        }

        .color-group h3 {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .swatches {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
        }

        .swatch:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .create-box {
            background-color: var(--bg-card);
            padding: 28px;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00bbf9);
color: #090a0f;
border: none;
padding: 14px 24px;
border-radius: 10px;
font-size: 1rem;
font-weight: 800;
cursor: pointer;
width: 100%;
}
.btn-primary:hover {
filter: brightness(1.1);
}
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(5, 6, 10, 0.88);
display: none;
align-items: center;
justify-content: center;
z-index: 200;
padding: 20px;
}
.modal-overlay.open {
display: flex;
}
.modal-card {
background-color: var(--bg-card);
border: 1px solid var(--accent);
border-radius: 18px;
width: 100%;
max-width: 640px;
overflow: hidden;
}
.modal-header {
padding: 18px 24px;
border-bottom: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
}
.close-btn {
background: none;
border: none;
color: var(--text-muted);
font-size: 1.6rem;
cursor: pointer;
}
.game-viewport {
padding: 24px;
text-align: center;
}
#play-arena {
width: 100%;
height: 250px;
background-color: var(--bg-dark);
border: 1px dashed var(--accent);
border-radius: 12px;
margin: 18px 0;
position: relative;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
}
#target-block {
width: 54px;
height: 54px;
background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
color: #fff;
border-radius: 12px;
position: absolute;
cursor: pointer;
display: none;
align-items: center;
justify-content: center;
font-weight: 800;
user-select: none;
}
footer {
text-align: center;
padding: 18px;
font-size: 0.8rem;
color: var(--text-muted);
border-top: 1px solid var(--border);
background-color: var(--bg-panel);
}
@media (max-width: 768px) {
.avatar-studio { grid-template-columns: 1fr; }
.user-badge span { display: none; }
}

let rogobux = 500;
let sessionScore = 0;
const games = [
{ title: "Neo-Tokyo Parkour 2026", author: "CyberDev_26", genre: "Cyber-Obby", players: "4.8k", likes: "97%", icon: "⚡", color: "linear-gradient(135deg, #00f5d4, #00bbf9)" },
{ title: "Fábrica de Androides Tycoon", author: "FutureLabs", genre: "Tycoon 2026", players: "3.1k", likes: "93%", icon: "🤖", color: "linear-gradient(135deg, #7b2cbf, #3a0ca3)" },
{ title: "Sobrevive a la Tormenta Solar", author: "OrbitHost", genre: "Supervivencia", players: "6.4k", likes: "98%", icon: "☀️", color: "linear-gradient(135deg, #f72585, #7209b7)" },
{ title: "Simulador de Minería Lunar", author: "Artemis_X", genre: "Simulador IA", players: "2.2k", likes: "90%", icon: "🛸", color: "linear-gradient(135deg, #4361ee, #4cc9f0)" },
{ title: "Arena Láser Zero-G", author: "QuantumByte", genre: "Arena PvP", players: "3.9k", likes: "95%", icon: "🔫", color: "linear-gradient(135deg, #ff006e, #8338ec)" },
{ title: "Metrópolis Hovercar Rol", author: "Skyline2026", genre: "Mundo Abierto", players: "8.1k", likes: "96%", icon: "🏎️", color: "linear-gradient(135deg, #06d6a0, #118ab2)" }
];
const colors = ["#00f5d4", "#00bbf9", "#7b2cbf", "#f72585", "#fee440", "#ff5400", "#8ac926", "#ffffff", "#2b2d42", "#141722"];
function renderGames(list = games) {
const grid = document.getElementById("gamesGrid");
if (!grid) return;
grid.innerHTML = "";
list.forEach(game => {
const card = document.createElement("div");
card.className = "game-card";
card.onclick = () => openGame(game);
card.innerHTML = <div class="game-thumb" style="background: ${game.color}"> <span class="genre-tag">${game.genre}</span> <span>${game.icon}</span> </div> <div class="game-info"> <div> <div class="game-title">${game.title}</div> <div class="game-author">Por @${game.author}</div> </div> <div class="game-meta"> <span>🟢 ${game.players} en línea</span> <span>⚡ ${game.likes}</span> </div> </div>;
grid.appendChild(card);
});
}
function filterGames() {
const term = document.getElementById("searchInput").value.toLowerCase();
const filtered = games.filter(g =>
g.title.toLowerCase().includes(term) ||
g.genre.toLowerCase().includes(term) ||
g.author.toLowerCase().includes(term)
);
renderGames(filtered);
}
function switchTab(tabId, btnElement) {
document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
document.getElementById(tabId).classList.add("active");
if (btnElement) {
document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("active"));
btnElement.classList.add("active");
}
}
function initAvatarSwatches() {
const createSwatches = (containerId, applyFn) => {
const container = document.getElementById(containerId);
if (!container) return;
colors.forEach(c => {
const sw = document.createElement("div");
sw.className = "swatch";
sw.style.backgroundColor = c;
sw.onclick = () => applyFn(c);
container.appendChild(sw);
});
};
createSwatches("skin-swatches", c => {
document.getElementById("part-head").style.backgroundColor = c;
document.getElementById("part-larm").style.backgroundColor = c;
document.getElementById("part-rarm").style.backgroundColor = c;
});
createSwatches("torso-swatches", c => {
document.getElementById("part-torso").style.backgroundColor = c;
document.getElementById("header-avatar").style.backgroundColor = c;
});
createSwatches("legs-swatches", c => {
document.getElementById("part-lleg").style.backgroundColor = c;
document.getElementById("part-rleg").style.backgroundColor = c;
});
}
function publishGame() {
const title = document.getElementById("newGameTitle").value.trim();
const genre = document.getElementById("newGameGenre").value;
const icon = document.getElementById("newGameIcon").value;
if (!title) {
alert("Escribe un nombre para tu servidor 2026.");
return;
}
games.unshift({
title: title,
author: "CyberPlayer_26",
genre: genre,
players: "1",
likes: "100%",
icon: icon,
color: "linear-gradient(135deg, #00f5d4, #7b2cbf)"
});
document.getElementById("newGameTitle").value = "";
renderGames();
switchTab("discover", document.getElementById("nav-discover"));
}
function openGame(game) {
sessionScore = 0;
document.getElementById("sessionScore").innerText = sessionScore;
document.getElementById("modalTitle").innerText = ${game.icon} ${game.title};
document.getElementById("modalDesc").innerText = Host: @${game.author} • Modo: ${game.genre} • Ping: 12ms;
document.getElementById("startGameBtn").style.display = "inline-block";
document.getElementById("target-block").style.display = "none";
document.getElementById("gameModal").classList.add("open");
}
function closeModal() {
document.getElementById("gameModal").classList.remove("open");
}
function startMiniGame() {
document.getElementById("startGameBtn").style.display = "none";
const block = document.getElementById("target-block");
block.style.display = "flex";
moveBlock();
}
function moveBlock() {
const arena = document.getElementById("play-arena");
const block = document.getElementById("target-block");
const maxX = Math.max(20, arena.clientWidth - 65);
const maxY = Math.max(20, arena.clientHeight - 65);
block.style.left = Math.floor(Math.random() * maxX) + "px";
block.style.top = Math.floor(Math.random() * maxY) + "px";
}
function hitTarget() {
sessionScore += 25;
rogobux += 25;
document.getElementById("sessionScore").innerText = sessionScore;
document.getElementById("rogobux-display").innerText = R$ ${rogobux};
moveBlock();
}
window.onload = function() {
renderGames();
initAvatarSwatches();
};
